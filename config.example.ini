# Selfcheck Watch config: ~/.config/selfcheck-watch.ini (created from config.example.ini on first run)
# Changes are picked up on the next check (or "Check now" in the menu).

[general]
# how often to check, in minutes (default 30)
interval_minutes=30
# request timeout, in seconds (default 30)
timeout_seconds=30
# headers sent to every endpoint: header.<Name>=<value>
#header.User-Agent=my-monitor/1.0
# an endpoint is OK when it answers HTTP 200 and the body matches ok_regex (JavaScript regex, default below)
#ok_regex="status"\s*:\s*"OK"
# otherwise the problem shown is every match of problem_regex (its first group, if it has one), joined with ", ";
# without it, or if it matches nothing, the first 100 characters of the body
#problem_regex=problem id: (\d+)
# both can also be set per endpoint, overriding these; backslashes are taken literally here

# One [section] per endpoint; the section name is the label in the menu.
# enabled=false -> listed in the menu but not checked (toggle it from the menu too).
# The two endpoints below are placeholders - replace them with your own and set enabled=true.
[production]
url=https://example.com/selfcheck/?format=json
enabled=false
# per-endpoint headers override the [general] ones
#header.Authorization=Bearer secret-token
#ok_regex=^pong$

[staging]
url=https://staging.example.com/selfcheck/?format=json
enabled=false
